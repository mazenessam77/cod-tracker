# VPC resolver — re-resolves backend.cod-tracker.local as ECS tasks rotate
resolver 169.254.169.253 valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    # ── Serve static frontend files ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse-proxy API requests to the backend service ──
    location /api/ {
        set $backend_upstream "backend.cod-tracker.local:5000";
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gzip compression ──
    gzip            on;
    gzip_types      text/css application/javascript application/json text/plain;
    gzip_min_length 256;
}
