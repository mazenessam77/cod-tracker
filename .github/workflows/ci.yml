# CI — lint, test, build images, push to ECR
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-2
  ECR_FRONTEND: cod-tracker-frontend
  ECR_BACKEND: cod-tracker-backend

permissions:
  id-token: write
  contents: read

jobs:

  lint-terraform:
    name: Lint Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint-terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend
        run: |
          docker build -f Dockerfile.frontend \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:latest .
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND --all-tags

      - name: Build & push backend
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:latest .
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND --all-tags
