# CD — provision infra, deploy to ECS
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: cod-tracker-cluster
  ECS_SVC_FRONTEND: cod-tracker-frontend
  ECS_SVC_BACKEND: cod-tracker-backend

permissions:
  id-token: write
  contents: read

jobs:

  # only run if CI passed (or manual trigger)
  gate:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed, proceeding with deploy"

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - run: terraform init
      - run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out backend
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SVC_BACKEND \
            --force-new-deployment

      - name: Roll out frontend
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SVC_FRONTEND \
            --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SVC_BACKEND $ECS_SVC_FRONTEND

      - name: Print app URL
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --names cod-tracker-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Live at: http://$ALB"
