version: "3.9"

# ============================================
# COD Achievement Tracker — Docker Compose
# 3-tier: Frontend (nginx) · Backend (Node) · DB (MySQL 8)
# ============================================

services:

  # ─── MySQL Database ───────────────────────
  db:
    image: mysql:8
    container_name: cod-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cod_tracker
      MYSQL_USER: coduser
      MYSQL_PASSWORD: codpass123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ─── Node.js Backend API ──────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cod-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: coduser
      DB_PASSWORD: codpass123
      DB_NAME: cod_tracker
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cod-network

  # ─── Nginx Frontend ──────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cod-network

# ─── Shared Resources ────────────────────
volumes:
  db_data:
    driver: local

networks:
  cod-network:
    driver: bridge
